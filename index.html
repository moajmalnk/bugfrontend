<!DOCTYPE html>
<html lang="en">
  <head>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t === 'light') document.documentElement.classList.remove('dark');
          else document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <meta charset="UTF-8" />
    <style>
      /* Critical first paint — avoid white flash; boot shell paints before JS/CSS */
      html, body { margin: 0; min-height: 100%; }
      html.dark, html.dark body { background: #0f172a; color: #e2e8f0; }
      html:not(.dark), html:not(.dark) body { background: #f8fafc; color: #0f172a; }
      html.allow-body-scroll body { overflow: auto; }
      #app-boot {
        min-height: 100vh;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.25rem;
        text-align: center;
        box-sizing: border-box;
        font-family: Inter, system-ui, -apple-system, sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }
      html.dark #app-boot { background: #0f172a; color: #e2e8f0; }
      #app-boot .eyebrow { margin: 0 0 0.75rem; font-size: 0.875rem; letter-spacing: 0.06em; text-transform: uppercase; color: #2563eb; font-weight: 600; }
      html.dark #app-boot .eyebrow { color: #60a5fa; }
      #app-boot h1 { margin: 0 0 1rem; font-size: clamp(1.75rem, 5vw, 2.75rem); font-weight: 700; line-height: 1.2; max-width: 40rem; color: #0f172a; }
      html.dark #app-boot h1 { color: #fff; }
      #app-boot .lead { margin: 0; font-size: 1.0625rem; line-height: 1.65; color: #64748b; max-width: 36rem; }
      html.dark #app-boot .lead { color: #94a3b8; }
    </style>
    
    <!-- Primary Meta Tags -->
    <title>BugRicer - Advanced Bug Tracking & Project Management Platform | CODO AI Innovations</title>
    <meta name="title" content="BugRicer - Advanced Bug Tracking & Project Management Platform | CODO AI Innovations" />
    <meta name="description" content="Professional bug tracking and project management platform for development teams. Streamline bug reporting, project collaboration, and team communication with advanced features and real-time notifications." />
    <meta name="keywords" content="bug tracking, project management, software development, team collaboration, bug reporting, issue tracking, development tools, CODO AI, BugRicer" />
    <meta name="author" content="CODO AI Innovations" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />
    <meta name="bingbot" content="index, follow" />
    
    <!-- Viewport and Mobile Optimization -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="BugRicer" />
    
    <!-- Favicon and Icons -->

    <link rel="shortcut icon" href="/favicon.ico">
    
    <!-- PWA Manifest — deferred so it leaves the critical request chain -->
    <script>
      window.addEventListener('load', function () {
        var l = document.createElement('link');
        l.rel = 'manifest';
        l.href = '/manifest.json';
        document.head.appendChild(l);
      });

  <body>
    <!-- Critical boot shell: paints before JS so FCP/LCP aren't blank white -->
    <div id="root">
      <div id="app-boot">
        <main id="main-content">
          <p class="eyebrow">BugRicer</p>
          <h1>Advanced Bug Tracking &amp; Project Management Platform</h1>
          <p class="lead">
            Streamline your development workflow with powerful bug tracking, seamless team collaboration, and comprehensive project management tools all in one place.
          </p>
        </main>
      </div>
    </div>
    <script type="module" src="./src/main.tsx"></script>
    
    <!-- Chunk load failures: React LoadingErrorModal owns UI -->
    <script>
      window.addEventListener('error', function(e) {
        if (e.filename && (e.filename.includes('.js') || e.filename.includes('chunk'))) {
          /* React LoadingErrorModal will handle showing the UI */
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason && e.reason.message && e.reason.message.includes('Loading chunk')) {
          /* React LoadingErrorModal will handle showing the UI */
        }
      });
    </script>
  </body>
</html>
